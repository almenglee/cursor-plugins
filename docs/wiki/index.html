<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent-Era SE Wiki</title>
  <style>
    :root {
      --bg: #ffffff; --side: #f8fafc; --fg: #0f172a; --muted: #475569;
      --border: #e2e8f0; --code-bg: #f1f5f9; --accent: #2563eb; --quote: #eff6ff;
    }
    [data-theme="dark"] {
      --bg: #0b0f19; --side: #111827; --fg: #e5e7eb; --muted: #94a3b8;
      --border: #1f2937; --code-bg: #161e2e; --accent: #60a5fa; --quote: #131c2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; display: flex; min-height: 100vh; background: var(--bg); color: var(--fg);
      font: 15px/1.65 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    aside {
      width: 280px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border);
      padding: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 14px; }
    .btn {
      border: 1px solid var(--border); background: var(--bg); color: var(--fg); border-radius: 6px;
      padding: 4px 8px; font-size: 12px; cursor: pointer;
    }
    #search {
      width: 100%; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--fg); font-size: 13px;
    }
    nav { display: flex; flex-direction: column; gap: 3px; }
    nav a {
      text-decoration: none; color: var(--muted); font-size: 13px; padding: 6px 9px;
      border-radius: 6px; line-height: 1.35;
    }
    nav a:hover { background: var(--code-bg); color: var(--fg); }
    nav a.active { background: var(--accent); color: #fff; font-weight: 600; }
    main { flex: 1; min-width: 0; padding: 32px 28px 64px; }
    article { max-width: 780px; margin: 0 auto; }
    h1, h2, h3, h4 { line-height: 1.3; margin: 1.5em 0 0.5em; }
    h1 { font-size: 1.9em; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h2 { font-size: 1.35em; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    h3 { font-size: 1.1em; }
    a { color: var(--accent); }
    p, ul, ol { margin: 0.7em 0; }
    ul, ol { padding-left: 1.5em; }
    li { margin: 0.25em 0; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
    blockquote {
      margin: 14px 0; padding: 10px 14px; border-left: 3px solid var(--accent);
      background: var(--quote); border-radius: 0 6px 6px 0; color: var(--fg);
    }
    blockquote p { margin: 0; }
    code {
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--code-bg); padding: 2px 5px; border-radius: 4px;
    }
    pre {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px; overflow-x: auto; margin: 14px 0;
    }
    pre code { background: none; padding: 0; font-size: 12.5px; }
    pre.mermaid-block::before {
      content: "diagram (mermaid)"; display: block; font-size: 11px; color: var(--muted);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13.5px; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
    th { background: var(--code-bg); font-weight: 600; }
    .pager {
      max-width: 780px; margin: 32px auto 0; padding-top: 16px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 12px; font-size: 13px;
    }
    @media (max-width: 780px) {
      body { flex-direction: column; }
      aside { width: 100%; height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--border); }
      main { padding: 20px 16px 48px; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <span>SE Principles Wiki</span>
      <button id="theme-btn" class="btn" type="button">Theme</button>
    </div>
    <input id="search" type="search" placeholder="Filter articles..." />
    <nav id="nav"></nav>
  </aside>
  <main>
    <article id="content"></article>
    <div id="pager" class="pager"></div>
  </main>

  <script src="./wiki-data.js"></script>
  <script>
    const pages = window.WIKI_PAGES || [];
    const navEl = document.getElementById("nav");
    const contentEl = document.getElementById("content");
    const pagerEl = document.getElementById("pager");
    const searchEl = document.getElementById("search");
    const themeBtn = document.getElementById("theme-btn");

    // Theme init
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    let theme = localStorage.getItem("wiki-theme") || (prefersDark ? "dark" : "light");
    const applyTheme = () => {
      document.documentElement.dataset.theme = theme;
      themeBtn.textContent = theme === "dark" ? "Light" : "Dark";
    };
    themeBtn.onclick = () => { theme = theme === "dark" ? "light" : "dark"; localStorage.setItem("wiki-theme", theme); applyTheme(); };
    applyTheme();

    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function inline(text) {
      const codes = [];
      let s = esc(text).replace(/`([^`]+)`/g, (_, c) => { codes.push(`<code>${c}</code>`); return `\x00C${codes.length - 1}\x00`; });
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        const clean = href.replace(/^\.\//, "");
        if (pages.some((p) => p.id === clean)) return `<a href="#${clean}">${label}</a>`;
        const ext = /^https?:\/\//.test(href) ? ' target="_blank" rel="noopener"' : "";
        return `<a href="${href}"${ext}>${label}</a>`;
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return s.replace(/\x00C(\d+)\x00/g, (_, i) => codes[Number(i)]);
    }

    function renderMd(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i++; continue; }
        // Code block
        const fence = line.match(/^```(\w*)/);
        if (fence) {
          const lang = fence[1] || "";
          const buf = [];
          i++;
          while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
          i++;
          const cls = lang === "mermaid" ? ' class="mermaid-block"' : "";
          out.push(`<pre${cls}><code>${esc(buf.join("\n"))}</code></pre>`);
          continue;
        }
        // Heading
        const h = line.match(/^(#{1,4})\s+(.+)$/);
        if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
        // HR
        if (/^---+$/.test(line.trim())) { out.push("<hr />"); i++; continue; }
        // Blockquote
        if (line.startsWith(">")) {
          const buf = [];
          while (i < lines.length && lines[i].startsWith(">")) buf.push(lines[i++].replace(/^>\s?/, ""));
          out.push(`<blockquote><p>${inline(buf.join("<br />"))}</p></blockquote>`);
          continue;
        }
        // Table
        if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:-]+\|/.test(lines[i + 1])) {
          const splitRow = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
          const headers = splitRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(splitRow(lines[i++]));
          out.push(
            `<table><thead><tr>${headers.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` +
            `<tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
          );
          continue;
        }
        // List
        if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
          const ordered = /^\s*\d+\./.test(line);
          const tag = ordered ? "ol" : "ul";
          const items = [];
          while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
            items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
          }
          out.push(`<${tag}>${items.map((it) => `<li>${inline(it)}</li>`).join("")}</${tag}>`);
          continue;
        }
        // Paragraph
        const p = [];
        while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|---|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) {
          if (lines[i].includes("|") && i + 1 < lines.length && /^\s*\|?[\s:-]+\|/.test(lines[i + 1])) break;
          p.push(lines[i++]);
        }
        out.push(`<p>${inline(p.join(" "))}</p>`);
      }
      return out.join("\n");
    }

    let currentId = pages[0]?.id || "README.md";

    function renderNav() {
      const q = searchEl.value.trim().toLowerCase();
      const filtered = pages.filter((p) => !q || p.title.toLowerCase().includes(q) || p.md.toLowerCase().includes(q));
      navEl.innerHTML = filtered
        .map((p) => `<a href="#${p.id}" class="${p.id === currentId ? "active" : ""}">${esc(p.title)}</a>`)
        .join("") || '<span style="font-size:12px;color:var(--muted)">No matches</span>';
    }

    function openPage(id) {
      const idx = pages.findIndex((p) => p.id === id);
      const page = idx >= 0 ? pages[idx] : pages[0];
      if (!page) return;
      currentId = page.id;
      document.title = `${page.title} · SE Wiki`;
      contentEl.innerHTML = renderMd(page.md);
      const prev = idx > 0 ? pages[idx - 1] : null;
      const next = idx >= 0 && idx < pages.length - 1 ? pages[idx + 1] : null;
      pagerEl.innerHTML =
        `<span>${prev ? `<a href="#${prev.id}">← ${esc(prev.title)}</a>` : ""}</span>` +
        `<span>${next ? `<a href="#${next.id}">${esc(next.title)} →</a>` : ""}</span>`;
      renderNav();
      window.scrollTo(0, 0);
    }

    const syncFromHash = () => openPage(decodeURIComponent(location.hash.slice(1)) || "README.md");
    window.addEventListener("hashchange", syncFromHash);
    searchEl.addEventListener("input", renderNav);
    syncFromHash();
  </script>
</body>
</html>
